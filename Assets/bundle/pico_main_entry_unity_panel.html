<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PICO Main Entry Unity Panel Preview</title>
<link rel="icon" href="data:,">
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif;}
  html,body{width:100%;height:100%;overflow:hidden;background:#2a2520;}
  #scene{position:fixed;inset:0;overflow:hidden;
    background:radial-gradient(circle at 30% 20%,rgba(255,235,200,.25),transparent 50%),
      linear-gradient(160deg,#6b5d4f 0%,#544a3f 30%,#3d362e 70%,#2a2520 100%);}
  #scene::before{content:"";position:absolute;top:8%;right:6%;width:280px;height:340px;
    background:linear-gradient(135deg,rgba(255,245,220,.55),rgba(180,200,230,.25));
    border:14px solid rgba(60,50,40,.6);border-radius:6px;box-shadow:0 0 80px rgba(255,240,200,.4);
    transform:perspective(600px) rotateY(-18deg);}
  .floor{position:absolute;bottom:0;left:0;right:0;height:34%;background:linear-gradient(rgba(120,95,65,0),rgba(90,70,48,.5));}
  .sofa{position:absolute;bottom:0;left:4%;width:340px;height:160px;background:#7a6a55;border-radius:40px 40px 0 0;
    box-shadow:inset 0 8px 20px rgba(0,0,0,.3);opacity:.55;}
  .plant{position:absolute;bottom:0;right:12%;width:90px;height:200px;background:linear-gradient(#3c5a2e,#2a4020);
    border-radius:50% 50% 8px 8px;opacity:.6;}
  #appwrap{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:min(92vw,1040px);}
  #panel{background:rgba(38,30,22,.72);backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%);
    border:2px solid rgba(255,210,150,.25);border-radius:40px;padding:38px 46px;color:#fff;
    box-shadow:0 30px 90px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.12);}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px;gap:20px;}
  .greet{font-size:34px;font-weight:800;color:#ffe7c2;white-space:nowrap;}
  .meta{font-size:24px;color:#ffd9a8;opacity:.9;white-space:nowrap;}
  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;}
  .card{min-width:0;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.12);border-radius:28px;
    padding:30px 16px;text-align:center;cursor:pointer;transition:all .45s cubic-bezier(.2,.8,.2,1);position:relative;color:#fff;}
  .card:hover{transform:scale(1.06) translateY(-6px);background:rgba(255,200,130,.22);border-color:#ffce8a;
    box-shadow:0 0 0 4px rgba(255,206,138,.35),0 20px 50px rgba(0,0,0,.4);}
  .card.disabled{cursor:default;opacity:.72;}
  .card.disabled:hover{transform:none;background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.12);box-shadow:none;}
  .ring{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;border:4px solid rgba(255,255,255,.2);opacity:0;}
  .card:hover .ring{opacity:1;border-top-color:#ffce8a;animation:spin 1.5s linear infinite;}
  .card.disabled:hover .ring{opacity:0;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .ic{height:78px;display:flex;align-items:center;justify-content:center;margin-bottom:14px;}
  .ic img{width:78px;height:78px;object-fit:contain;display:block;}
  .name{font-size:30px;font-weight:800;white-space:nowrap;}
  .desc{font-size:18px;color:#ffd9a8;margin-top:6px;opacity:.85;white-space:nowrap;}
  .badge{display:inline-flex;margin-top:12px;padding:5px 13px;border-radius:999px;background:rgba(0,0,0,.28);color:#ffe7c2;font-size:14px;font-weight:800;}
  .safebar{display:flex;justify-content:center;gap:26px;margin-top:30px;}
  .sbtn{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:700;padding:16px 30px;border-radius:50px;
    background:rgba(255,255,255,.14);color:#ffe7c2;white-space:nowrap;opacity:.82;}
  .sbtn img{width:24px;height:24px;object-fit:contain;}
  .winctrl{display:flex;justify-content:center;gap:22px;margin-top:22px;}
  .wbtn{width:62px;height:62px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;
    background:rgba(40,32,24,.75);backdrop-filter:blur(14px);border:2px solid rgba(255,210,150,.3);color:#ffe7c2;
    box-shadow:0 8px 24px rgba(0,0,0,.45);}
  .hint{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.7);font-size:15px;
    background:rgba(0,0,0,.4);padding:8px 20px;border-radius:30px;white-space:nowrap;}
  #toast{position:fixed;top:28px;left:50%;transform:translate(-50%,-16px);padding:13px 24px;border-radius:999px;
    background:rgba(38,30,22,.82);border:1px solid rgba(255,210,150,.35);box-shadow:0 18px 44px rgba(0,0,0,.42);
    color:#ffe7c2;font-size:18px;font-weight:800;opacity:0;pointer-events:none;transition:.25s;}
  #toast.show{opacity:1;transform:translate(-50%,0);}
  @media(max-width:900px){
    #appwrap{width:94vw;}
    #panel{padding:26px 24px;border-radius:30px;}
    .topbar{align-items:flex-start;flex-direction:column;}
    .greet{font-size:28px;}
    .meta{font-size:20px;}
    .cards{grid-template-columns:repeat(2,1fr);}
    .name{font-size:26px;}
    .safebar{gap:12px;flex-wrap:wrap;}
  }
</style>
</head>
<body>
<div id="scene">
  <div class="floor"></div>
  <div class="sofa"></div>
  <div class="plant"></div>
  <div id="appwrap">
    <div id="panel">
      <div class="topbar">
        <div class="greet">&#24352;&#22902;&#22902;&#65292;&#19978;&#21320;&#22909;</div>
        <div class="meta">&#26228; 22&#176; &#12288;&#19978;&#21320; 9:15</div>
      </div>
      <div class="cards">
        <div class="card" data-action="pingpong">
          <span class="ring"></span>
          <span class="ic"><img src="svg_icons/U+1F3D3_table_tennis_paddle_and_ball.svg" alt=""></span>
          <div class="name">&#20581;&#24247;&#28216;&#25103;</div>
          <div class="desc">&#21160;&#33041;&#21448;&#24320;&#24515;</div>
        </div>
        <div class="card" data-action="rehab">
          <span class="ring"></span>
          <span class="ic"><img src="svg_icons/U+1F9D8_person_in_lotus_position.svg" alt=""></span>
          <div class="name">&#24247;&#22797;&#36816;&#21160;</div>
          <div class="desc">&#20170;&#26085; 3 &#20010;&#21160;&#20316;</div>
        </div>
        <div class="card disabled" data-action="empty">
          <span class="ring"></span>
          <span class="ic"><img src="svg_icons/U+1F9F3_luggage.svg" alt=""></span>
          <div class="name">VR &#26053;&#28216;</div>
          <div class="desc">&#36275;&#19981;&#20986;&#25143;&#30475;&#19990;&#30028;</div>
          <span class="badge">&#24453;&#25509;&#20837;</span>
        </div>
        <div class="card disabled" data-action="empty">
          <span class="ring"></span>
          <span class="ic"><img src="svg_icons/U+1F4F7_camera.svg" alt=""></span>
          <div class="name">&#24448;&#26085;&#26102;&#20809;</div>
          <div class="desc">&#22238;&#21040;&#20174;&#21069;</div>
          <span class="badge">&#24453;&#25509;&#20837;</span>
        </div>
      </div>
      <div class="safebar">
        <div class="sbtn"><img src="svg_icons/U+2699_gear.svg" alt="">&#35774;&#32622;</div>
        <div class="sbtn"><img src="svg_icons/U+2764_heavy_black_heart.svg" alt="">&#25105;&#30340;&#20581;&#24247;</div>
        <div class="sbtn"><img src="svg_icons/U+1F3C6_trophy.svg" alt="">&#25490;&#34892;&#27036;</div>
      </div>
    </div>
    <div class="winctrl">
      <div class="wbtn">-</div>
      <div class="wbtn">x</div>
    </div>
  </div>
</div>
<div id="toast"></div>
<div class="hint">&#21345;&#29255;&#24748;&#20572;&#20250;&#25918;&#22823;&#65307;&#26053;&#28216;&#12289;&#24448;&#26085;&#26102;&#20809;&#21644;&#24213;&#37096;&#21151;&#33021;&#20026;&#24453;&#25509;&#20837;</div>
<script>
  const toast = document.getElementById("toast");
  function showToast(text){
    toast.textContent = text;
    toast.classList.add("show");
    window.clearTimeout(showToast.timer);
    showToast.timer = window.setTimeout(()=>toast.classList.remove("show"), 1600);
  }
  document.querySelectorAll(".card").forEach(card=>{
    card.addEventListener("click", ()=>{
      const action = card.dataset.action;
      if(action === "pingpong") showToast("Unity: LoadPingPong()");
      else if(action === "rehab") showToast("Unity: LoadRehab()");
      else showToast("\u5f85\u63a5\u5165");
    });
  });
</script>
</body>
</html>
