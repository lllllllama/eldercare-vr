<svg xmlns="http://www.w3.org/2000/svg" width="720" height="960" viewBox="0 0 720 960" font-family="'PingFang SC','Noto Serif SC','Songti SC',serif">
  <!-- ============ DEFS ============ -->
  <defs>
    <!-- 木质宣纸背景 -->
    <linearGradient id="bgWood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E9DCC0"/>
      <stop offset="50%" stop-color="#D9C7A3"/>
      <stop offset="100%" stop-color="#C6B085"/>
    </linearGradient>

    <!-- 主卡片：温暖宣纸 -->
    <linearGradient id="cardRice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBF5E6"/>
      <stop offset="100%" stop-color="#F1E6CC"/>
    </linearGradient>

    <!-- 选项卡（推荐） -->
    <linearGradient id="cardHi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF8E4"/>
      <stop offset="100%" stop-color="#F3E5BE"/>
    </linearGradient>

    <!-- 选项卡（普通） -->
    <linearGradient id="cardNormal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7EFD9"/>
      <stop offset="100%" stop-color="#EADFC0"/>
    </linearGradient>

    <!-- 金色推荐标签 -->
    <linearGradient id="goldRibbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E0AC5A"/>
      <stop offset="50%" stop-color="#D48F3A"/>
      <stop offset="100%" stop-color="#B57327"/>
    </linearGradient>

    <!-- 玉绿 -->
    <linearGradient id="jade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8FB08A"/>
      <stop offset="100%" stop-color="#5F8560"/>
    </linearGradient>

    <!-- 卡片阴影 -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="dockShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="4"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.2"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- 宣纸纹理点 -->
    <pattern id="paperTex" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <rect width="60" height="60" fill="transparent"/>
      <circle cx="10" cy="15" r="0.6" fill="#B89A5E" opacity="0.08"/>
      <circle cx="40" cy="30" r="0.5" fill="#B89A5E" opacity="0.06"/>
      <circle cx="25" cy="50" r="0.7" fill="#B89A5E" opacity="0.07"/>
    </pattern>

    <!-- 木纹背景 -->
    <pattern id="woodTex" x="0" y="0" width="8" height="960" patternUnits="userSpaceOnUse">
      <rect width="8" height="960" fill="url(#bgWood)"/>
      <rect x="0" width="1" height="960" fill="#B99A6C" opacity="0.15"/>
    </pattern>
  </defs>

  <!-- ============ 背景 ============ -->
  <rect width="720" height="960" fill="url(#woodTex)"/>
  <rect width="720" height="960" fill="url(#paperTex)" opacity="0.6"/>

  <!-- ============ 主卡片 ============ -->
  <g filter="url(#softShadow)">
    <rect x="40" y="60" width="640" height="720" rx="32" fill="url(#cardRice)" stroke="#C9A96A" stroke-width="1.2" stroke-opacity="0.5"/>
    <rect x="40" y="60" width="640" height="720" rx="32" fill="url(#paperTex)" opacity="0.5"/>
  </g>

  <!-- 卡片右上角水墨竹叶装饰 -->
  <g opacity="0.18" transform="translate(560, 90)">
    <path d="M 20 10 Q 50 30 40 70 Q 30 50 20 10 Z" fill="#4A6B4A"/>
    <path d="M 45 20 Q 75 40 65 80 Q 55 60 45 20 Z" fill="#4A6B4A"/>
    <path d="M 15 60 L 15 130" stroke="#6B5A3E" stroke-width="1.5"/>
  </g>

  <!-- ============ Header ============ -->
  <!-- 冥想图标 -->
  <g transform="translate(150, 120)">
    <circle cx="20" cy="20" r="22" fill="#F5C97C" opacity="0.35"/>
    <!-- 简化的坐禅小人 -->
    <circle cx="20" cy="12" r="6" fill="#8B6B3E"/>
    <path d="M 8 30 Q 20 20 32 30 L 30 36 Q 20 32 10 36 Z" fill="#8B6B3E"/>
    <path d="M 4 34 Q 20 40 36 34" stroke="#8B6B3E" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  <text x="205" y="150" font-size="34" font-weight="700" fill="#3E2E1F">请选择康复训练</text>
  <text x="360" y="188" font-size="16" fill="#7A6952" text-anchor="middle">跟着虚拟教练慢慢来，随时可以暂停休息</text>

  <!-- 分隔线（细金线） -->
  <line x1="120" y1="215" x2="600" y2="215" stroke="#C9A96A" stroke-width="0.8" opacity="0.4"/>

  <!-- ============ 左：八段锦（推荐） ============ -->
  <g>
    <!-- 卡片体 -->
    <rect x="72" y="270" width="272" height="440" rx="24" fill="url(#cardHi)" stroke="#D4A574" stroke-width="1.5" stroke-opacity="0.6"/>
    <rect x="72" y="270" width="272" height="440" rx="24" fill="url(#paperTex)" opacity="0.4"/>

    <!-- 推荐 Ribbon -->
    <g transform="translate(148, 254)">
      <rect x="0" y="0" width="120" height="34" rx="17" fill="url(#goldRibbon)"/>
      <text x="60" y="22" font-size="15" font-weight="700" fill="#FFF8E4" text-anchor="middle">✦ 今日推荐</text>
    </g>

    <!-- 图标：老人举手圆环姿势（八段锦） -->
    <g transform="translate(208, 340)">
      <!-- 光晕圆 -->
      <circle cx="0" cy="30" r="52" fill="#F5C97C" opacity="0.28"/>
      <!-- 手臂圆环 -->
      <ellipse cx="0" cy="-8" rx="26" ry="20" fill="none" stroke="#C48844" stroke-width="6" stroke-linecap="round"/>
      <!-- 头 -->
      <circle cx="0" cy="10" r="12" fill="#E8B87E"/>
      <!-- 灰发 -->
      <path d="M -10 4 Q 0 -4 10 4 L 10 8 L -10 8 Z" fill="#9C9385"/>
      <!-- 身体 -->
      <path d="M -14 22 Q 0 20 14 22 L 16 60 Q 0 58 -16 60 Z" fill="#C48844"/>
      <!-- 腿 -->
      <rect x="-10" y="58" width="8" height="24" fill="#8B6B3E" rx="3"/>
      <rect x="2" y="58" width="8" height="24" fill="#8B6B3E" rx="3"/>
    </g>

    <!-- 标题 -->
    <text x="208" y="510" font-size="36" font-weight="700" fill="#3E2E1F" text-anchor="middle">八段锦</text>
    <text x="208" y="542" font-size="15" fill="#7A6952" text-anchor="middle">舒展筋骨 · 经典养生</text>

    <!-- 标签 pills -->
    <g transform="translate(94, 570)">
      <rect x="0" y="0" width="105" height="34" rx="17" fill="#FFF8E4" stroke="#C9A96A" stroke-opacity="0.4"/>
      <text x="14" y="22" font-size="14" fill="#7A5E2E">⏱</text>
      <text x="32" y="22" font-size="14" fill="#5A4A32">约 10 分钟</text>
    </g>
    <g transform="translate(212, 570)">
      <rect x="0" y="0" width="105" height="34" rx="17" fill="#FFF8E4" stroke="#C9A96A" stroke-opacity="0.4"/>
      <circle cx="16" cy="17" r="5" fill="#5F8560"/>
      <text x="30" y="22" font-size="14" fill="#5A4A32">强度轻</text>
    </g>

    <!-- 底部呼吸提示 -->
    <text x="208" y="655" font-size="12" fill="#9A8560" text-anchor="middle" opacity="0.7">— 缓慢呼吸 · 循序渐进 —</text>
  </g>

  <!-- ============ 右：太极 ============ -->
  <g>
    <rect x="376" y="270" width="272" height="440" rx="24" fill="url(#cardNormal)" stroke="#B8A785" stroke-width="1.2" stroke-opacity="0.5"/>
    <rect x="376" y="270" width="272" height="440" rx="24" fill="url(#paperTex)" opacity="0.4"/>

    <!-- 图标：老人打坐 -->
    <g transform="translate(512, 340)">
      <circle cx="0" cy="30" r="52" fill="#8FB08A" opacity="0.25"/>
      <!-- 头 -->
      <circle cx="0" cy="0" r="12" fill="#E8B87E"/>
      <path d="M -10 -6 Q 0 -14 10 -6 L 10 -2 L -10 -2 Z" fill="#9C9385"/>
      <!-- 身体三角坐姿 -->
      <path d="M -30 60 Q 0 15 30 60 Z" fill="#5F8560"/>
      <!-- 手叠放 -->
      <ellipse cx="0" cy="42" rx="14" ry="6" fill="#E8B87E"/>
      <!-- 腿盘坐 -->
      <ellipse cx="-18" cy="60" rx="12" ry="6" fill="#E8B87E"/>
      <ellipse cx="18" cy="60" rx="12" ry="6" fill="#E8B87E"/>
    </g>

    <text x="512" y="510" font-size="36" font-weight="700" fill="#3E2E1F" text-anchor="middle">太极</text>
    <text x="512" y="542" font-size="15" fill="#7A6952" text-anchor="middle">柔和缓慢 · 平衡身心</text>

    <g transform="translate(398, 570)">
      <rect x="0" y="0" width="105" height="34" rx="17" fill="#F7EFD9" stroke="#B8A785" stroke-opacity="0.4"/>
      <text x="14" y="22" font-size="14" fill="#7A5E2E">⏱</text>
      <text x="32" y="22" font-size="14" fill="#5A4A32">约 12 分钟</text>
    </g>
    <g transform="translate(516, 570)">
      <rect x="0" y="0" width="105" height="34" rx="17" fill="#F7EFD9" stroke="#B8A785" stroke-opacity="0.4"/>
      <circle cx="16" cy="17" r="5" fill="#D4A574"/>
      <text x="30" y="22" font-size="14" fill="#5A4A32">强度中</text>
    </g>

    <text x="512" y="655" font-size="12" fill="#9A8560" text-anchor="middle" opacity="0.7">— 以柔克刚 · 内外兼修 —</text>
  </g>

  <!-- ============ 返回上一页按钮 ============ -->
  <g>
    <rect x="120" y="740" width="480" height="60" rx="30" fill="#F7EFD9" stroke="#C9A96A" stroke-width="1.2" stroke-opacity="0.6"/>
    <text x="360" y="778" font-size="19" font-weight="600" fill="#5A4A32" text-anchor="middle">← 返回上一页</text>
  </g>

  <!-- ============ MR Dock 悬浮功能区 ============ -->
  <g filter="url(#dockShadow)">
    <!-- Dock 底板 -->
    <rect x="240" y="840" width="240" height="72" rx="36" fill="#3E2E1F" fill-opacity="0.85" stroke="#C9A96A" stroke-width="1" stroke-opacity="0.4"/>
    <rect x="240" y="840" width="240" height="72" rx="36" fill="url(#paperTex)" opacity="0.15"/>

    <!-- 最小化 -->
    <g transform="translate(288, 876)">
      <circle r="24" fill="#F5EFE0" fill-opacity="0.12" stroke="#F5EFE0" stroke-opacity="0.25"/>
      <rect x="-10" y="-1.5" width="20" height="3" rx="1.5" fill="#F5EFE0"/>
    </g>
    <text x="288" y="932" font-size="11" fill="#E8DCC0" text-anchor="middle" opacity="0.85">最小化</text>

    <!-- 关闭 -->
    <g transform="translate(360, 876)">
      <circle r="24" fill="#C4544A" fill-opacity="0.85" stroke="#E8938B" stroke-opacity="0.5"/>
      <path d="M -8 -8 L 8 8 M 8 -8 L -8 8" stroke="#FFF8E4" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <text x="360" y="932" font-size="11" fill="#E8DCC0" text-anchor="middle" opacity="0.85">关闭</text>

    <!-- 设置 -->
    <g transform="translate(432, 876)">
      <circle r="24" fill="#F5EFE0" fill-opacity="0.12" stroke="#F5EFE0" stroke-opacity="0.25"/>
      <!-- 齿轮 -->
      <g fill="#F5EFE0">
        <circle cx="0" cy="0" r="4.5" fill="none" stroke="#F5EFE0" stroke-width="2"/>
        <rect x="-1.5" y="-11" width="3" height="4" rx="0.5"/>
        <rect x="-1.5" y="7" width="3" height="4" rx="0.5"/>
        <rect x="-11" y="-1.5" width="4" height="3" rx="0.5"/>
        <rect x="7" y="-1.5" width="4" height="3" rx="0.5"/>
        <rect x="-8.5" y="-8.5" width="3" height="4" rx="0.5" transform="rotate(-45)"/>
        <rect x="5.5" y="-4.5" width="3" height="4" rx="0.5" transform="rotate(-45)"/>
        <rect x="-8.5" y="6" width="3" height="4" rx="0.5" transform="rotate(45)"/>
        <rect x="4.5" y="7" width="3" height="4" rx="0.5" transform="rotate(45)"/>
      </g>
    </g>
    <text x="432" y="932" font-size="11" fill="#E8DCC0" text-anchor="middle" opacity="0.85">设置</text>
  </g>
</svg>
